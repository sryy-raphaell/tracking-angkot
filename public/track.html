<!DOCTYPE html>
<html>
<head>
    <title>Live Tracking</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        #info { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            z-index: 1000; 
            background: white; 
            padding: 10px; 
            border-radius: 5px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.5); 
        }
    </style>
</head>
<body>
    <div id="info">
        <b>Tracking: <span id="vid">...</span></b><br>
        Status: <span id="status">Connecting...</span>
    </div>
    <div id="map"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const vehicleId = params.get('id') || 'Default-ID';
        document.getElementById('vid').innerText = vehicleId;

        const map = L.map('map').setView([-0.9306, 100.3683], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marker = L.marker([-0.9306, 100.3683]).addTo(map);
        marker.bindPopup("Angkot Sedang Berjalan").openPopup();

        // FUNGSI UNTUK AMBIL DATA VIA HTTP GET 
        function fetchLocation() {
            fetch(`/api/track?vehicleId=${vehicleId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.lat && data.lng) {
                        marker.setLatLng([data.lat, data.lng]);
                        map.panTo([data.lat, data.lng]);
                        document.getElementById('status').innerText = "Live (Updated)";
                    } else {
                        document.getElementById('status').innerText = "Menunggu sopir...";
                    }
                })
                .catch(() => {
                    document.getElementById('status').innerText = "Gagal konek";
                });
        }

        setInterval(fetchLocation, 3000);
        fetchLocation();
    </script>
</body>
</html>
